# Scrape configuration for the local stack.
#
# One target, scraped often: an investigation takes seconds, so a minute-long
# interval would miss most of what happened during an incident demo.

global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: ai-operations-agent
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          environment: local
