<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
  <title id="title">What the agent cannot do</title>
  <desc id="desc">Three layers of enforcement: the model proposes, the registry validates and refuses, and a person authorises every write.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#59636e"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0969da"/>
    </marker>
    <marker id="arrow-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#cf222e"/>
    </marker>
  </defs>
  <rect width="1000" height="430" fill="#ffffff"/>
<text x="32" y="34" font-size="12" font-weight="700" letter-spacing="0.7" fill="#59636e">WHAT THE AGENT CANNOT DO</text>
<text x="32" y="54" text-anchor="start" font-size="11.5" fill="#59636e">Every limit below is enforced in code, before a tool runs. None of it is a prompt instruction.</text>
<rect x="32" y="84" width="292" height="40" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
<text x="178.0" y="109.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">The model proposes</text>
<circle cx="50" cy="144" r="3" fill="#0969da"/>
<text x="64" y="148" text-anchor="start" font-size="12" fill="#1f2328">sees only the tools the policy allows</text>
<circle cx="50" cy="174" r="3" fill="#0969da"/>
<text x="64" y="178" text-anchor="start" font-size="12" fill="#1f2328">answers with a name and arguments</text>
<circle cx="50" cy="204" r="3" fill="#0969da"/>
<text x="64" y="208" text-anchor="start" font-size="12" fill="#1f2328">cannot add a tool or widen its own reach</text>
<rect x="345" y="84" width="292" height="40" rx="8" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/>
<text x="491.0" y="109.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">The registry decides</text>
<circle cx="363" cy="144" r="3" fill="#d1d9e0"/>
<text x="377" y="148" text-anchor="start" font-size="12" fill="#1f2328">unknown name → refused and recorded</text>
<circle cx="363" cy="174" r="3" fill="#d1d9e0"/>
<text x="377" y="178" text-anchor="start" font-size="12" fill="#1f2328">arguments validated against a schema</text>
<circle cx="363" cy="204" r="3" fill="#d1d9e0"/>
<text x="377" y="208" text-anchor="start" font-size="12" fill="#1f2328">identical call repeated → refused</text>
<circle cx="363" cy="234" r="3" fill="#d1d9e0"/>
<text x="377" y="238" text-anchor="start" font-size="12" fill="#1f2328">timeout and retry belong to the runtime</text>
<rect x="658" y="84" width="292" height="40" rx="8" fill="#fff8c5" stroke="#9a6700" stroke-width="1.5"/>
<text x="804.0" y="109.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">A person authorises</text>
<circle cx="676" cy="144" r="3" fill="#9a6700"/>
<text x="690" y="148" text-anchor="start" font-size="12" fill="#1f2328">write tools are invisible to the planner</text>
<circle cx="676" cy="174" r="3" fill="#9a6700"/>
<text x="690" y="178" text-anchor="start" font-size="12" fill="#1f2328">the graph pauses; state is checkpointed</text>
<circle cx="676" cy="204" r="3" fill="#9a6700"/>
<text x="690" y="208" text-anchor="start" font-size="12" fill="#1f2328">the decision carries no action of its own</text>
<circle cx="676" cy="234" r="3" fill="#9a6700"/>
<text x="690" y="238" text-anchor="start" font-size="12" fill="#1f2328">permission is granted for one step</text>
<path d="M 324 104 L 345 104" fill="none" stroke="#0969da" stroke-width="1.6" marker-end="url(#arrow-accent)"/>
<path d="M 637 104 L 658 104" fill="none" stroke="#0969da" stroke-width="1.6" marker-end="url(#arrow-accent)"/>
<rect x="32" y="300" width="936" height="44" rx="10" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5"/>
<text x="500.0" y="327.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328"></text>
<text x="52" y="327" text-anchor="start" font-size="12.5" fill="#1f2328">agent_unapproved_writes_total must stay at zero. It is derived from the recorded calls, not from a flag, and pages immediately if it ever moves.</text>
<text x="32" y="380" text-anchor="start" font-size="12" fill="#59636e">Budgets: 12 tool calls · 30 workflow steps · 4 loop iterations · 15 s per tool · 2 identical calls · no shell, no code execution, no tool outside the registry.</text>
</svg>
