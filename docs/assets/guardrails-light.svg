<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
  <title id="title">Чего агент не может</title>
  <desc id="desc">Три слоя контроля: модель предлагает, реестр проверяет и отказывает, человек санкционирует каждую запись.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#59636e"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0969da"/>
    </marker>
    <marker id="arrow-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#cf222e"/>
    </marker>
  </defs>
  <rect width="1000" height="430" fill="#ffffff"/>
<text x="32" y="34" font-size="12" font-weight="700" letter-spacing="0.7" fill="#59636e">ЧЕГО АГЕНТ НЕ МОЖЕТ</text>
<text x="32" y="54" text-anchor="start" font-size="11.5" fill="#59636e">Каждое ограничение ниже вшито в код и проверяется до запуска инструмента. Ничего из этого не является инструкцией в промпте.</text>
<rect x="32" y="84" width="292" height="40" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
<text x="178.0" y="109.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">Модель предлагает</text>
<circle cx="50" cy="144" r="3" fill="#0969da"/>
<text x="64" y="148" text-anchor="start" font-size="12" fill="#1f2328">видит только разрешённые политикой инструменты</text>
<circle cx="50" cy="174" r="3" fill="#0969da"/>
<text x="64" y="178" text-anchor="start" font-size="12" fill="#1f2328">отвечает именем и аргументами</text>
<circle cx="50" cy="204" r="3" fill="#0969da"/>
<text x="64" y="208" text-anchor="start" font-size="12" fill="#1f2328">не может добавить инструмент или расширить доступ</text>
<rect x="345" y="84" width="292" height="40" rx="8" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/>
<text x="491.0" y="109.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">Реестр решает</text>
<circle cx="363" cy="144" r="3" fill="#d1d9e0"/>
<text x="377" y="148" text-anchor="start" font-size="12" fill="#1f2328">неизвестное имя → отказ, вызов записан</text>
<circle cx="363" cy="174" r="3" fill="#d1d9e0"/>
<text x="377" y="178" text-anchor="start" font-size="12" fill="#1f2328">аргументы проверяются схемой</text>
<circle cx="363" cy="204" r="3" fill="#d1d9e0"/>
<text x="377" y="208" text-anchor="start" font-size="12" fill="#1f2328">повтор идентичного вызова → отказ</text>
<circle cx="363" cy="234" r="3" fill="#d1d9e0"/>
<text x="377" y="238" text-anchor="start" font-size="12" fill="#1f2328">таймаут и ретрай — свойство рантайма</text>
<rect x="658" y="84" width="292" height="40" rx="8" fill="#fff8c5" stroke="#9a6700" stroke-width="1.5"/>
<text x="804.0" y="109.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">Человек санкционирует</text>
<circle cx="676" cy="144" r="3" fill="#9a6700"/>
<text x="690" y="148" text-anchor="start" font-size="12" fill="#1f2328">write-инструменты не видны планировщику</text>
<circle cx="676" cy="174" r="3" fill="#9a6700"/>
<text x="690" y="178" text-anchor="start" font-size="12" fill="#1f2328">граф встаёт на паузу, состояние сохраняется</text>
<circle cx="676" cy="204" r="3" fill="#9a6700"/>
<text x="690" y="208" text-anchor="start" font-size="12" fill="#1f2328">решение не несёт собственного действия</text>
<circle cx="676" cy="234" r="3" fill="#9a6700"/>
<text x="690" y="238" text-anchor="start" font-size="12" fill="#1f2328">право выдаётся на один шаг</text>
<path d="M 324 104 L 345 104" fill="none" stroke="#0969da" stroke-width="1.6" marker-end="url(#arrow-accent)"/>
<path d="M 637 104 L 658 104" fill="none" stroke="#0969da" stroke-width="1.6" marker-end="url(#arrow-accent)"/>
<rect x="32" y="296" width="936" height="56" rx="10" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5"/>
<text x="500.0" y="329.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328"></text>
<text x="52" y="320" text-anchor="start" font-size="12.5" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">agent_unapproved_writes_total обязан стоять на нуле.</text>
<text x="52" y="339" text-anchor="start" font-size="11.5" fill="#59636e">Он выводится из записанных вызовов, а не из флага, и поднимает тревогу сразу, как только сдвинется.</text>
<text x="32" y="384" text-anchor="start" font-size="12" fill="#59636e">Бюджеты: 12 вызовов · 30 шагов графа · 4 итерации цикла · 15 с на инструмент · 2 идентичных вызова.</text>
<text x="32" y="404" text-anchor="start" font-size="12" fill="#59636e">Никакого shell, исполнения произвольного кода и инструментов вне реестра.</text>
</svg>
