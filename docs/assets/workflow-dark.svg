<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
  <title id="title">The investigation graph</title>
  <desc id="desc">A LangGraph workflow: deterministic collection and correlation, then a bounded loop of tool selection, then a human approval gate before any write.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9198a1"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4493f8"/>
    </marker>
    <marker id="arrow-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f85149"/>
    </marker>
  </defs>
  <rect width="1000" height="700" fill="#0d1117"/>
<text x="32" y="34" font-size="12" font-weight="700" letter-spacing="0.7" fill="#9198a1">THE INVESTIGATION GRAPH</text>
<text x="32" y="54" text-anchor="start" font-size="11.5" fill="#9198a1">Deterministic work first, then a bounded agentic loop, then a human.</text>
<rect x="374.0" y="82" width="76" height="28" rx="14" fill="#0d1117" stroke="#3d444d" stroke-width="1.5"/>
<text x="412.0" y="101.0" text-anchor="middle" font-size="14" font-weight="600" fill="#9198a1">START</text>
<path d="M 412.0 110 L 412.0 132" fill="none" stroke="#9198a1" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="300" y="132" width="224" height="50" rx="8" fill="#151b23" stroke="#3d444d" stroke-width="1.5"/>
<text x="412.0" y="153.0" text-anchor="middle" font-size="14" font-weight="600" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">analyze_task</text>
<text x="412.0" y="170.0" text-anchor="middle" font-size="11.5" fill="#9198a1">service and time window</text>
<path d="M 412.0 182 L 412.0 206" fill="none" stroke="#9198a1" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="300" y="206" width="224" height="50" rx="8" fill="#151b23" stroke="#3d444d" stroke-width="1.5"/>
<text x="412.0" y="227.0" text-anchor="middle" font-size="14" font-weight="600" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">collect_initial_context</text>
<text x="412.0" y="244.0" text-anchor="middle" font-size="11.5" fill="#9198a1">metrics · deploys · errors · alerts</text>
<path d="M 296 231 L 224 231" fill="none" stroke="#f85149" stroke-width="1.6" marker-end="url(#arrow-danger)"/>
<text x="260" y="222" text-anchor="middle" font-size="10.5" fill="#9198a1">no signal</text>
<rect x="24" y="206" width="200" height="50" rx="8" fill="#2b1618" stroke="#f85149" stroke-width="1.5"/>
<text x="124.0" y="227.0" text-anchor="middle" font-size="14" font-weight="600" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">insufficient_context</text>
<text x="124.0" y="244.0" text-anchor="middle" font-size="11.5" fill="#9198a1">stops, and says why</text>
<path d="M 412.0 256 L 412.0 280" fill="none" stroke="#9198a1" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="300" y="280" width="224" height="50" rx="8" fill="#0f2913" stroke="#3fb950" stroke-width="1.5"/>
<text x="412.0" y="301.0" text-anchor="middle" font-size="14" font-weight="600" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">correlate</text>
<text x="412.0" y="318.0" text-anchor="middle" font-size="11.5" fill="#9198a1">spike ↔ deployment ↔ commit</text>
<path d="M 412.0 330 L 412.0 362" fill="none" stroke="#9198a1" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="184" y="352" width="372" height="264" rx="12" fill="none" stroke="#3d444d" stroke-width="1.25" stroke-dasharray="6 5"/>
<text x="198" y="371" font-size="11" font-weight="600" letter-spacing="0.6" fill="#9198a1">AGENTIC LOOP — BOUNDED</text>
<rect x="300" y="382" width="224" height="50" rx="8" fill="#121d2f" stroke="#4493f8" stroke-width="1.5"/>
<text x="412.0" y="403.0" text-anchor="middle" font-size="14" font-weight="600" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">select_tool</text>
<text x="412.0" y="420.0" text-anchor="middle" font-size="11.5" fill="#9198a1">the model's one real choice</text>
<path d="M 412.0 432 L 412.0 458" fill="none" stroke="#9198a1" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="300" y="458" width="224" height="50" rx="8" fill="#151b23" stroke="#3d444d" stroke-width="1.5"/>
<text x="412.0" y="479.0" text-anchor="middle" font-size="14" font-weight="600" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">execute_tool</text>
<text x="412.0" y="496.0" text-anchor="middle" font-size="11.5" fill="#9198a1">validated · timed · recorded</text>
<path d="M 412.0 508 L 412.0 534" fill="none" stroke="#9198a1" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="300" y="534" width="224" height="50" rx="8" fill="#151b23" stroke="#3d444d" stroke-width="1.5"/>
<text x="412.0" y="555.0" text-anchor="middle" font-size="14" font-weight="600" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">evaluate_observation</text>
<text x="412.0" y="572.0" text-anchor="middle" font-size="11.5" fill="#9198a1">did that change anything?</text>
<path d="M 300 559 L 208 559 L 208 407 L 300 407" fill="none" stroke="#4493f8" stroke-width="1.6" marker-end="url(#arrow-accent)"/>
<text x="156.0" y="487.0" text-anchor="middle" font-size="11" fill="#9198a1">more to learn</text>
<text x="196" y="604" text-anchor="start" font-size="10.5" fill="#9198a1">exits on: nothing asked · budget spent · no progress · 4 iterations</text>
<path d="M 524 559 L 690 559" fill="none" stroke="#9198a1" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="607.0" y="550.0" text-anchor="middle" font-size="11" fill="#9198a1">enough</text>
<rect x="676" y="534" width="224" height="50" rx="8" fill="#0f2913" stroke="#3fb950" stroke-width="1.5"/>
<text x="788.0" y="555.0" text-anchor="middle" font-size="14" font-weight="600" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">generate_analysis</text>
<text x="788.0" y="572.0" text-anchor="middle" font-size="11.5" fill="#9198a1">structured · grounded</text>
<path d="M 788.0 534 L 788.0 504" fill="none" stroke="#9198a1" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="676" y="454" width="224" height="50" rx="8" fill="#151b23" stroke="#3d444d" stroke-width="1.5"/>
<text x="788.0" y="475.0" text-anchor="middle" font-size="14" font-weight="600" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">propose_action</text>
<text x="788.0" y="492.0" text-anchor="middle" font-size="11.5" fill="#9198a1">confidence ≥ 0.6, or nothing</text>
<path d="M 788.0 454 L 788.0 424" fill="none" stroke="#f85149" stroke-width="1.6" marker-end="url(#arrow-danger)"/>
<text x="798.0" y="443" text-anchor="start" font-size="10.5" fill="#9198a1">write proposed</text>
<path d="M 676 479 L 636 479 L 636 190 L 680 190" fill="none" stroke="#9198a1" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="626" y="300" text-anchor="end" font-size="10.5" fill="#9198a1">nothing to write</text>
<rect x="676" y="374" width="224" height="50" rx="8" fill="#2b2412" stroke="#d29922" stroke-width="1.5"/>
<text x="788.0" y="395.0" text-anchor="middle" font-size="14" font-weight="600" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">request_approval</text>
<text x="788.0" y="412.0" text-anchor="middle" font-size="11.5" fill="#9198a1">graph pauses · state checkpointed</text>
<path d="M 788.0 374 L 788.0 344" fill="none" stroke="#f85149" stroke-width="1.6" marker-end="url(#arrow-danger)"/>
<text x="798.0" y="363" text-anchor="start" font-size="10.5" fill="#9198a1">approved</text>
<path d="M 900 399 L 940 399 L 940 190 L 896 190" fill="none" stroke="#9198a1" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="950" y="300" text-anchor="start" font-size="10.5" fill="#9198a1">rejected</text>
<rect x="676" y="294" width="224" height="50" rx="8" fill="#2b1618" stroke="#f85149" stroke-width="1.5"/>
<text x="788.0" y="315.0" text-anchor="middle" font-size="14" font-weight="600" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">execute_action</text>
<text x="788.0" y="332.0" text-anchor="middle" font-size="11.5" fill="#9198a1">one tool · one step</text>
<path d="M 788.0 294 L 788.0 240" fill="none" stroke="#9198a1" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="676" y="190" width="224" height="50" rx="8" fill="#151b23" stroke="#3d444d" stroke-width="1.5"/>
<text x="788.0" y="211.0" text-anchor="middle" font-size="14" font-weight="600" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">final_response</text>
<text x="788.0" y="228.0" text-anchor="middle" font-size="11.5" fill="#9198a1">says what it did, and did not, do</text>
<path d="M 788.0 190 L 788.0 164" fill="none" stroke="#9198a1" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="756.0" y="136" width="64" height="28" rx="14" fill="#0d1117" stroke="#3d444d" stroke-width="1.5"/>
<text x="788.0" y="155.0" text-anchor="middle" font-size="14" font-weight="600" fill="#9198a1">END</text>
<rect x="32" y="634" width="936" height="48" rx="10" fill="#2b2412" stroke="#d29922" stroke-width="1.5"/>
<text x="500.0" y="663.0" text-anchor="middle" font-size="14" font-weight="600" fill="#e6edf3"></text>
<text x="52" y="656" text-anchor="start" font-size="12" fill="#e6edf3">The pause is durable. State is checkpointed, so the decision arrives as a separate HTTP request from a separate person —</text>
<text x="52" y="673" text-anchor="start" font-size="11.5" fill="#9198a1">and the action executed is the one the graph saved, not anything the approving request carries.</text>
</svg>
