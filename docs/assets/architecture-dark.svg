<text x="134.0" y="355.0" text-anchor="middle" font-size="14" font-weight="600" fill="#e6edf3">State</text>
<text x="134.0" y="372.0" text-anchor="middle" font-size="11.5" fill="#9198a1">typed, checkpointed</text>
<rect x="234" y="336" width="172" height="46" rx="8" fill="#151b23" stroke="#3d444d" stroke-width="1.5"/>
<text x="320.0" y="355.0" text-anchor="middle" font-size="14" font-weight="600" fill="#e6edf3">Guardrails</text>
<text x="320.0" y="372.0" text-anchor="middle" font-size="11.5" fill="#9198a1">budgets · allowlist · r/w</text>
