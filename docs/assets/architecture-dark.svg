<text x="134.0" y="439.0" text-anchor="middle" font-size="11.5" fill="#9198a1">chooses the next tool</text>
<text x="134.0" y="453.0" text-anchor="middle" font-size="11.5" fill="#9198a1">from the allowed set</text>
<rect x="234" y="396" width="172" height="60" rx="8" fill="#2b2412" stroke="#d29922" stroke-width="1.5"/>
<text x="320.0" y="422.0" text-anchor="middle" font-size="14" font-weight="600" fill="#e6edf3">Approval gate</text>
<text x="320.0" y="439.0" text-anchor="middle" font-size="11.5" fill="#9198a1">pauses for a human</text>
<text x="320.0" y="453.0" text-anchor="middle" font-size="11.5" fill="#9198a1">before any write</text>
